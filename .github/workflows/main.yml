name: Como usar variáveis de ambiente
on:
  workflow_dispatch:
env:
  ENV_WORKFLOW: "Valor WORKFLOW"
jobs:
  teste-env:
    runs-on: ubuntu-latest
    env:
      ENV_JOB: "Valor JOB teste-env"
    steps:
      - name: Execução
        env:
          ENV_ACTION: "Valor ACTION - Execução"
        run: |
          echo "$ENV_WORKFLOW"
          echo "$ENV_JOB"
          echo "$ENV_ACTION"
      - name: Execução 2
        env:
          ENV_ACTION_2: "Valor ACTION - Segunda Execução"
        run: |
          echo "$ENV_WORKFLOW"
          echo "$ENV_JOB"
          echo "$ENV_ACTION"
          echo "$ENV_ACTION_2"
  teste-env-2:
    runs-on: ubuntu-latest
    env:
      ENV_JOB_2: "Valor JOB SEGUNDO teste-env"
    steps:
      - name: Execução
        run: |
          echo "$ENV_WORKFLOW"
          echo "$ENV_JOB"
          echo "$ENV_JOB_2"
